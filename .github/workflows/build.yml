name: Build LIBERA FX and SDKs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Determine build version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Set year, month and build number
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $run = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if (-not $run.created_at) {
              throw 'The workflow run creation timestamp is missing.'
          }
          $created = ([DateTimeOffset]$run.created_at).ToOffset([TimeSpan]::FromHours(9))
          "value=$($created.Year).$($created.Month).$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

  authoring-acceptance:
    name: MCP authoring transitions (release gate)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify MCP operations and state after each transition
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:LIBERAFX_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'mcp-authoring-data'
          dotnet run --project Tests/CommentImageSmokeTests.csproj -c Release -- --mcp-authoring-transitions
      - name: Compare batched CPU execution with the interpreter
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:LIBERAFX_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'cpu-batch-data'
          $fixtures = Join-Path $env:RUNNER_TEMP 'cpu-batch-fixtures'
          $fallback = Join-Path $env:RUNNER_TEMP 'cpu-batch-fallback'
          $build = Join-Path $env:RUNNER_TEMP 'cpu-batch-build'
          dotnet run --project Tests/CommentImageSmokeTests.csproj -c Release --no-build -- --cpu-particles
          dotnet run --project Tests/CommentImageSmokeTests.csproj -c Release --no-build -- --particle-benchmark-fixtures $fixtures
          dotnet run --project Tests/CommentImageSmokeTests.csproj -c Release --no-build -- --cpu-particle-fixture $fallback
          # Instrument only this disposable test build; exported SDKs remain normal Release builds.
          cmake -S Runtime -B $build -DLIBERAFX_BUILD_TESTS=ON -DLIBERAFX_BUILD_INTEROP=ON '-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi /EHsc' '-DCMAKE_EXE_LINKER_FLAGS=/DEBUG /INCREMENTAL:NO'
          cmake --build $build --config Release --target liberafx_cpu_particle_batch_tests liberafx_interop_tests --parallel 2
          $compilerInfo = Get-ChildItem (Join-Path $build 'CMakeFiles') -Filter CMakeCXXCompiler.cmake -Recurse | Select-Object -First 1
          $compilerPath = [regex]::Match((Get-Content $compilerInfo.FullName -Raw), 'set\(CMAKE_CXX_COMPILER "([^"]+)"\)').Groups[1].Value
          $asanRuntime = Join-Path (Split-Path $compilerPath) 'clang_rt.asan_dynamic-x86_64.dll'
          if (-not (Test-Path $asanRuntime)) { throw 'The selected compiler must provide the AddressSanitizer runtime.' }
          $env:PATH = (Split-Path $asanRuntime) + [IO.Path]::PathSeparator + $env:PATH
          $env:ASAN_OPTIONS = 'halt_on_error=1:alloc_dealloc_mismatch=1'
          & (Join-Path $build 'Release/liberafx_cpu_particle_batch_tests.exe') `
            --aot (Join-Path $fixtures 'CpuFountain-1000.lfxb') (Join-Path $fixtures 'CpuFountain-aot-1000.lfxb') `
            --aot (Join-Path $fixtures 'CpuFountain-retirement.lfxb') (Join-Path $fixtures 'CpuFountain-aot-retirement.lfxb') `
            --aot (Join-Path $fixtures 'CpuFountain-1000.lfxb') (Join-Path $fixtures 'CpuFountain-binary-1000.lfxb') `
            --aot (Join-Path $fixtures 'CpuFountain-retirement.lfxb') (Join-Path $fixtures 'CpuFountain-binary-retirement.lfxb') `
            --fused (Join-Path $fixtures 'CpuFountain-1000.lfxb') `
            (Join-Path $fixtures 'CpuFountain-retirement.lfxb') `
            --unfused (Join-Path $fixtures 'CpuBatch-math.lfxb') `
            (Join-Path $fixtures 'CpuBirth-zero-life.lfxb') `
            --birth-divide (Join-Path $fixtures 'CpuBirth-divide.lfxb') `
            --birth-mixed (Join-Path $fixtures 'CpuBirth-mixed.lfxb') `
            --spawn-fallback (Join-Path $fixtures 'CpuBirth-unsupported.lfxb') `
            --divide-zero (Join-Path $fixtures 'CpuBatch-divide-zero.lfxb') `
            --mixed-error (Join-Path $fixtures 'CpuBatch-error-order.lfxb') `
            (Join-Path $fallback 'cpu-particles.lfxb')
          $env:LIBERAFX_CPU_READ_FIXTURE_DIR = $fixtures
          & (Join-Path $build 'Release/liberafx_interop_tests.exe')

  editor:
    name: ${{ matrix.name }}
    needs: [version, authoring-acceptance]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LibraFX-windows-x64
            runner: windows-2022
            rid: win-x64
          - name: LibraFX-macos-arm64
            runner: macos-15
            rid: osx-arm64
          - name: LibraFX-linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish editor and converter
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $artifacts = Join-Path $env:RUNNER_TEMP 'editor-artifacts'
          $package = Join-Path $env:RUNNER_TEMP 'editor-package'
          New-Item -ItemType Directory -Path $artifacts | Out-Null
          $editor = Join-Path $package 'Editor'
          if ($env:TARGET_RID -eq 'osx-arm64') {
              $app = Join-Path $package 'LIBERA FX.app'
              $editor = Join-Path $app 'Contents/MacOS'
          }
          $versionProperties = @("-p:InformationalVersion=$env:BUILD_VERSION", '-p:IncludeSourceRevisionInInformationalVersion=false')
          dotnet publish LiberaFx.csproj -c Release -r $env:TARGET_RID --self-contained true -o $editor @versionProperties
          dotnet publish Tools/Converter/LiberaFx.Converter.csproj -c Release -r $env:TARGET_RID --self-contained true -o (Join-Path $package 'Converter') @versionProperties
          Copy-Item -LiteralPath 'LICENSE' -Destination $package
          [ordered]@{
              buildVersion = $env:BUILD_VERSION
              sourceRevision = $env:GITHUB_SHA
              runtimeIdentifier = $env:TARGET_RID
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'build-info.json') -Encoding utf8
          Get-Item -LiteralPath (Join-Path $editor 'BundledPlugins/Extensions/Git/liberafx-extension.json'),
              (Join-Path $editor 'BundledPlugins/Inspectors/ColorRgb/liberafx-inspector.json') | Out-Null
          if ($env:TARGET_RID -eq 'win-x64') {
              $launcher = Join-Path $env:RUNNER_TEMP 'windows-launcher'
              cmake -S Tools/Packaging/Windows -B $launcher -G 'Visual Studio 17 2022' -A x64
              cmake --build $launcher --config Release
              Copy-Item -LiteralPath (Join-Path $launcher 'Release/LiberaFx.exe') -Destination $package

              $publicVersion = [version]$env:BUILD_VERSION
              $msiYear = $publicVersion.Major - 2000
              if ($msiYear -lt 0 -or $msiYear -gt 255 -or $publicVersion.Build -gt 65535) {
                  throw "Build version $env:BUILD_VERSION is outside Windows Installer version limits."
              }
              $msiVersion = "$msiYear.$($publicVersion.Minor).$($publicVersion.Build)"
              dotnet tool restore
              dotnet wix build Tools/Packaging/Windows/LiberaFx.wxs -arch x64 -pdbtype none `
                  -bindpath "Payload=$package" -d "MsiVersion=$msiVersion" `
                  -out (Join-Path $artifacts "LibraFX-$env:BUILD_VERSION-windows-x64.msi")
              $windowsZip = Join-Path $artifacts "LibraFX-$env:BUILD_VERSION-windows-x64.zip"
              tar -a -cf $windowsZip -C $package LiberaFx.exe Editor Converter build-info.json LICENSE
              $zipEntries = tar -tf $windowsZip
              if ('LiberaFx.exe' -notin $zipEntries -or 'Editor/LiberaFx.exe' -notin $zipEntries) {
                  throw 'The Windows ZIP must contain a root launcher and the editor payload.'
              }
          }
          if ($env:TARGET_RID -eq 'osx-arm64') {
              $plist = Join-Path $app 'Contents/Info.plist'
              Copy-Item Tools/Packaging/macOS/Info.plist -Destination $plist
              plutil -replace CFBundleVersion -string $env:GITHUB_RUN_NUMBER $plist
              plutil -replace CFBundleShortVersionString -string $env:BUILD_VERSION $plist
              plutil -lint $plist
              /bin/sh -c 'test -x "$1"' sh (Join-Path $editor 'LiberaFx')
              ditto -c -k --sequesterRsrc --keepParent $package (Join-Path $artifacts "LibraFX-$env:BUILD_VERSION-macos-arm64.zip")
          }
          if ($env:TARGET_RID -eq 'linux-x64') {
              /bin/sh -c 'test -x "$1"' sh (Join-Path $editor 'LiberaFx')
              tar -czf (Join-Path $artifacts "LibraFX-$env:BUILD_VERSION-linux-x64.tar.gz") -C $package Editor Converter build-info.json LICENSE
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.name }}-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/editor-artifacts
          if-no-files-found: error

  sdk:
    name: LibraSDK
    needs: [version, authoring-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test portable Core with Clang
        run: |
          cmake -S Runtime -B "$RUNNER_TEMP/core-build" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DLIBERAFX_BUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/core-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/core-build" --output-on-failure --no-tests=error
      - name: Stage Core SDK
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: ./Tools/Export-EngineSdk.ps1 -Engine Core -OutputDirectory (Join-Path $env:RUNNER_TEMP 'LibraSDK') -BuildVersion $env:BUILD_VERSION
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: LibraSDK-source-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/LibraSDK
          if-no-files-found: error
          include-hidden-files: true

  adapters:
    name: LibraFor${{ matrix.engine }}
    needs: [version, authoring-acceptance]
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [Unreal, Unity, Godot]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stage engine SDK sources
        shell: pwsh
        env:
          ENGINE: ${{ matrix.engine }}
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'sdk')
          ./Tools/Export-EngineSdk.ps1 -Engine $env:ENGINE -OutputDirectory (Join-Path $stage.FullName 'Source') -BuildVersion $env:BUILD_VERSION
          Copy-Item -LiteralPath (Join-Path $stage.FullName 'Source/VERSION.json') -Destination $stage.FullName
      - name: Stage and verify the copy-ready Unreal source plugin
        if: matrix.engine == 'Unreal'
        shell: pwsh
        run: |
          ./Tests/Verify-UnrealPluginPackaging.ps1 -UnrealSdkRoot (Join-Path $env:RUNNER_TEMP 'sdk/Source')
          $project = Join-Path (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'unreal-project')).FullName 'Smoke.uproject'
          Set-Content -LiteralPath $project -Value '{"FileVersion":3,"EngineAssociation":"5.7","Modules":[]}'
          & (Join-Path $env:RUNNER_TEMP 'sdk/Source/Runtime/Integrations/Unreal/Install-LibraRuntimeForUnreal.ps1') -ProjectPath $project
          $plugin = Join-Path (Split-Path -Parent $project) 'Plugins/LibraRuntimeForUnreal'
          Move-Item -LiteralPath $plugin -Destination (Join-Path $env:RUNNER_TEMP 'sdk/LibraRuntimeForUnreal')
      - name: Build Unity Windows x64 native bridge
        if: matrix.engine == 'Unity'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $build = Join-Path $env:RUNNER_TEMP 'unity-build'
          cmake -S (Join-Path $env:RUNNER_TEMP 'sdk/Source/Runtime') -B $build -G 'Visual Studio 17 2022' -A x64
          cmake --build $build --config Release --target liberafx_native --parallel 2
          $native = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'sdk/Native/win-x64')
          Copy-Item -LiteralPath (Join-Path $build 'Release/liberafx_native.dll') -Destination $native.FullName
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.engine == 'Godot'
        with:
          repository: godotengine/godot-cpp
          ref: 24b9df7a88d40bcaf1f157703d4220185cb71fbf
          path: .ci/godot-cpp
          persist-credentials: false
      - name: Build Godot 4.7 Windows x64 GDExtension
        if: matrix.engine == 'Godot'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $build = Join-Path $env:RUNNER_TEMP 'godot-build'
          $source = Join-Path $env:RUNNER_TEMP 'sdk/Source/Runtime/Integrations/Godot'
          $godotCpp = Join-Path $env:GITHUB_WORKSPACE '.ci/godot-cpp'
          cmake -S $source -B $build -G 'Visual Studio 17 2022' -A x64 "-DGODOT_CPP_DIR=$godotCpp"
          cmake --build $build --config Release --target liberafx_godot --parallel 2
          $native = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'sdk/Native/win-x64')
          $bin = New-Item -ItemType Directory -Path (Join-Path $native.FullName 'bin')
          Copy-Item -LiteralPath (Join-Path $build 'bin/Release/liberafx_godot.dll') -Destination $bin.FullName
          Copy-Item -LiteralPath (Join-Path $source 'liberafx.gdextension') -Destination $native.FullName
      - name: Stage copy-ready Unity and Godot folders
        if: matrix.engine != 'Unreal'
        shell: pwsh
        run: ./Tools/Stage-CopyReadyEngineFolder.ps1 -Engine ${{ matrix.engine }} -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'sdk')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: LibraFor${{ matrix.engine }}-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/sdk
          if-no-files-found: error
          include-hidden-files: true
