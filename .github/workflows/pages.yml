name: Documentation

on:
  pull_request:
    paths: ['docs/site/**', 'docs/images/afterimage-gate-editor.png', '.github/workflows/pages.yml', 'Tools/Generate-NodeReference.py', 'Assets/Nodes/**', 'Assets/Enums/**', 'Assets/Translations/**', 'Assets/Modules/manifest.json', 'Assets/Brand/LibraFx.ico']
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/images/afterimage-gate-editor.png', '.github/workflows/pages.yml', 'Tools/Generate-NodeReference.py', 'Assets/Nodes/**', 'Assets/Enums/**', 'Assets/Translations/**', 'Assets/Modules/manifest.json', 'Assets/Brand/LibraFx.ico']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Stage reviewed documentation
        run: |
          mkdir -p pages-source/{images/editor,ja,_layouts,assets/css}
          cp docs/site/_config.yml pages-source/
          sed 's|\.\./images/afterimage-gate-editor\.png|images/afterimage-gate-editor.png|g' docs/site/index.md > pages-source/index.md
          cp docs/site/_layouts/bilingual.html pages-source/_layouts/
          cp docs/site/assets/css/libradark.css pages-source/assets/css/
          cp Assets/Brand/LibraFx.ico pages-source/assets/libera-fx.ico
          for file in getting-started.md workspace-tour.md first-fountain.md engine-integration.md editor-reference.md authoring.md gpu-particles.md glossary.md scalar-math-nodes.md cpu-particles.md flexible-plane-draw.md quaternion-random.md fluid-2d.md procedural-resources.md preview-update.md production-workflow.md batch-conversion.md; do
            cp "docs/site/$file" pages-source/
            cp "docs/site/ja/$file" pages-source/ja/
          done
          sed 's|\.\./\.\./images/afterimage-gate-editor\.png|../images/afterimage-gate-editor.png|g' docs/site/ja/index.md > pages-source/ja/index.md
          cp docs/images/afterimage-gate-editor.png pages-source/images/
          cp docs/site/images/editor/{chat,content,crash-reports,engine-connection,f-curve,gpu-dsl,gpu-flow,gpu-kernel,history,inspector,live-game,log,node-list,outliner,profiler,revision-history,search,settings-appearance,settings-extensions,settings-inspectors,settings-projects,settings-servers,settings-shortcuts,sprite,startup,timeline,workspace}.png pages-source/images/editor/
          cp docs/site/images/editor/cpu-particles-*.png pages-source/images/editor/
          cp docs/site/images/editor/fluid-2d-*.png pages-source/images/editor/
          cp docs/site/images/editor/procedural-model-flow-*.png pages-source/images/editor/
          python3 Tools/Generate-NodeReference.py pages-source
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./pages-source
          destination: ./pages-output
      - name: Verify the rendered pages
        run: |
          for file in index.html getting-started.html workspace-tour.html first-fountain.html engine-integration.html editor-reference.html authoring.html gpu-particles.html node-reference.html glossary.html scalar-math-nodes.html cpu-particles.html flexible-plane-draw.html quaternion-random.html fluid-2d.html procedural-resources.html preview-update.html production-workflow.html batch-conversion.html; do
            test -s "pages-output/$file"
            test -s "pages-output/ja/$file"
            for lang in en ja; do
              rendered="pages-output/$file"
              if [ "$lang" = ja ]; then rendered="pages-output/ja/$file"; fi
              grep -Fq "<html lang=\"$lang\" data-bs-theme=\"dark\">" "$rendered"
              grep -Fq 'bootstrap@5.3.3/dist/css/bootstrap.min.css' "$rendered"
              grep -Fq 'href="/LibraFX/assets/css/libradark.css"' "$rendered"
              grep -Fq 'aria-current="page"' "$rendered"
            done
            route="$file"
            if [ "$file" = index.html ]; then route=""; fi
            grep -Fq "href=\"/LibraFX/ja/$route\" hreflang=\"ja\"" "pages-output/$file"
            grep -Fq "href=\"/LibraFX/$route\" hreflang=\"en\"" "pages-output/ja/$file"
          done
          test -s pages-output/assets/css/libradark.css
          test -s pages-output/assets/libera-fx.ico
          test -s pages-output/images/afterimage-gate-editor.png
          for image in pages-source/images/editor/*.png; do
            test -s "pages-output/images/editor/${image##*/}"
          done
          for lang in en ja; do
            rendered="pages-output/cpu-particles.html"
            if [ "$lang" = ja ]; then rendered="pages-output/ja/cpu-particles.html"; fi
            for view in root stages spawn update draw; do
              grep -Fq "images/editor/cpu-particles-$view-$lang.png" "$rendered"
            done
            rendered="pages-output/fluid-2d.html"
            if [ "$lang" = ja ]; then rendered="pages-output/ja/fluid-2d.html"; fi
            for view in flow output; do
              grep -Fq "images/editor/fluid-2d-$view-$lang.png" "$rendered"
            done
            for phase in initial risen; do
              grep -Fq "images/editor/fluid-2d-unity-$phase.png" "$rendered"
            done
          done
          grep -q 'getting-started.html' pages-output/index.html
          grep -q 'engine-integration.html' pages-output/index.html
          grep -q 'getting-started.html' pages-output/ja/index.html
          grep -q 'engine-integration.html' pages-output/ja/index.html
          for lang in '' ja/; do
            grep -Fq 'id="gpu"' "pages-output/${lang}glossary.html"
            grep -Fq 'glossary.html#gpu' "pages-output/${lang}gpu-particles.html"
            grep -q 'node-reference.html' "pages-output/${lang}index.html"
            grep -q 'gpu-particles.html' "pages-output/${lang}index.html"
            grep -q 'images/editor/gpu-kernel.png' "pages-output/${lang}gpu-particles.html"
            grep -q 'procedural-resources.html' "pages-output/${lang}index.html"
            grep -q 'images/editor/procedural-model-flow-' "pages-output/${lang}procedural-resources.html"
            grep -q 'images/editor/workspace.png' "pages-output/${lang}editor-reference.html"
            grep -q 'id="category-values"' "pages-output/${lang}node-reference.html"
            grep -q 'id="node-sequence"' "pages-output/${lang}node-reference.html"
            grep -q 'id="standard-modules"' "pages-output/${lang}node-reference.html"
            if grep -Eq 'id="node-(matrixruntime|lifecycleruntime|gameioruntime)' "pages-output/${lang}node-reference.html"; then
              exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ./pages-output

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
